name: Validate package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.22.1']
    steps:
      - uses: actions/checkout@v7
        with:
          path: package
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      # Needed until helpers is published and the registry lockfile is refreshed.
      - id: bootstrap
        working-directory: package
        run: node scripts/needs-bootstrap.js
      - uses: actions/checkout@v7
        if: steps.bootstrap.outputs.needed == 'true'
        with:
          repository: AtidaTech/contentful-lib-helpers
          path: helpers
          persist-credentials: false
      - if: steps.bootstrap.outputs.needed == 'true'
        working-directory: helpers
        run: |
          mkdir -p ../package/.release
          npm pack --ignore-scripts --pack-destination ../package/.release
      - run: npm ci --ignore-scripts
        working-directory: package
      - run: npm run check
        working-directory: package
      - run: npm run format:check
        working-directory: package
      - run: npm audit --audit-level=low
        working-directory: package
